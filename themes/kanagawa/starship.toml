"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](bg1)\
$os\
$username\
[](bg:bg2 fg:bg1)\
$directory\
[](fg:bg2 bg:bg3)\
$git_branch\
$git_status\
[](fg:bg3 bg:BG4)\
$c\
$elixir\
$elm\
$golang\
$gradle\
$haskell\
$java\
$julia\
$nodejs\
$nim\
$rust\
$scala\
$python\
[](fg:BG4 bg:bg5)\
$docker_context\
[](fg:bg5 bg:bg6)\
$time\
[ ](fg:bg6)\
$line_break$character
"""
palette = 'kanagawa'

[palettes.kanagawa]
fg0 = '#C7BF92'
bg1 = '#16161D'
bg2 = '#1C1C22'
bg3 = '#2e2e38'
bg4 = '#484858'
bg5 = '#5a5a6d'
bg6 = '#6c6c83'
blue = '#7FB4CA'
aqua = '#689d6a'
green = '#98971a'
orange = '#d65d0e'
purple = '#b16286'
red = '#c34043'
yellow = '#d79921'

# Disable the blank line at the start of the prompt
# add_newline = false

# You can also replace your username with a neat symbol like   or disable this
# and use the os module below
[username]
show_always = true
style_user = "bg:bg1 fg:fg0"
style_root = "bg:bg1 fg:fg0"
format = '[ $user ]($style)'
disabled = false

# An alternative to the username module which displays a symbol that
# represents the current operating system
[os]
style = "bg:bg1 fg:fg0"
disabled = false # Disabled by default

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[directory]
style = "bg:bg2 fg:fg0"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

# Here is how you can shorten some long paths by text replacement
# similar to mapped_locations in Oh My Posh:
[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
# Keep in mind that the order matters. For example:
# "Important Documents" = " 󰈙 "
# will not be replaced, because "Documents" was already substituted before.
# So either put "Important Documents" before "Documents" or use the substituted version:
# "Important 󰈙 " = " 󰈙 "

[c]
symbol = " "
style = "bg:BG4 fg:fg0"
format = '[ $symbol ($version) ]($style)'

[cpp]
symbol = " "
style = "bg:BG4 fg:fg0"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = " "
style = "bg:#bg5 fg:fg0"
format = '[ $symbol $context ]($style)'

[elixir]
symbol = " "
style = "bg:BG4 fg:fg0"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = " "
style = "bg:BG4 fg:fg0"
format = '[ $symbol ($version) ]($style)'

[git_branch]
symbol = ""
style = "bg:bg3 fg:fg0"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:bg3 fg:fg0"
format = '[$all_status$ahead_behind ]($style)'

[golang]
symbol = " "
style = "bg:BG4 fg:fg0"
format = '[ $symbol ($version) ]($style)'

[gradle]
style = "bg:BG4 fg:fg0"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = " "
style = "bg:BG4 fg:fg0"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "bg:BG4 fg:fg0"
format = '[ $symbol ($version) ]($style)'

[julia]
symbol = " "
style = "bg:BG4 fg:fg0"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
style = "bg:BG4 fg:fg0"
format = '[ $symbol ($version) ]($style)'

[nim]
symbol = "󰆥 "
style = "bg:BG4 fg:fg0"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = "bg:BG4 fg:fg0"
format = '[ $symbol ($version) ]($style)'

[scala]
symbol = " "
style = "bg:BG4 fg:fg0"
format = '[ $symbol ($version) ]($style)'

[python]
symbol = ""
style = "bg:BG4 fg:fg0"
format = '[ $symbol( $version) ]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:bg6 fg:fg0"
format = '[  $time ]($style)'

[character]
disabled = false
success_symbol = '[](bold fg:blue)'
error_symbol = '[](bold fg:red)'
vimcmd_symbol = '[](bold fg:blue)'
vimcmd_replace_one_symbol = '[](bold fg:purple)'
vimcmd_replace_symbol = '[](bold fg:purple)'
vimcmd_visual_symbol = '[](bold fg:yellow)'